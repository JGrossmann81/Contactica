name: Build Contactica (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Cache downloaded libraries
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Show compiler errors on the run page
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 30 | ForEach-Object { "::error::$($_.Line.Trim())" }

      - name: Package
        shell: pwsh
        run: |
          $out = "Contactica-${{ github.ref_name }}".Replace('/', '-')
          New-Item -ItemType Directory -Force -Path dist/$out | Out-Null
          Copy-Item build/Release/* dist/$out -Recurse
          Copy-Item README.md, LICENSE-THIRD-PARTY.md dist/$out
          Compress-Archive -Path dist/$out -DestinationPath dist/$out.zip
          "ZIP=dist/$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DVersion=0.1.0 "/DSourceDir=$PWD\build\Release" installer\Contactica.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist\Contactica-Setup-*.exe | Select-Object -First 1
          "SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Contactica-installer
          path: ${{ env.SETUP }}

      - name: Upload the build (download it from the Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: Contactica-windows
          path: ${{ env.ZIP }}

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
